version: 2
# This repository had no Dependabot configuration, so nothing ever proposed an
# update and its pinned versions could drift silently. Node 20 is removed from
# GitHub-hosted runners on 2026-09-16, which is exactly the kind of deadline a
# repo with no update proposals walks into unwarned.
#
# Minor/patch are grouped to keep PR volume low. Majors arrive individually --
# those are the ones that carry runtime bumps and deserve their own CI run.
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      actions-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      pip-minor-patch:
        update-types: ["minor", "patch"]
    # These four are pinned on purpose. requirements-live.txt states the v2
    # ancestry LoRA (kohya/sd-scripts format) was validated against exactly this
    # regime, and that diffusers >=0.38 regressed its text-encoder conversion
    # (empty rank_dict -> IndexError in _create_lora_config). Dependabot proposed
    # diffusers 0.39.0, transformers 5.14.1 and gradio 6.20.0 within an hour of
    # this file first landing; all three were closed. Security advisories still
    # come through -- `ignore` only suppresses version updates.
    ignore:
      - dependency-name: "diffusers"
      - dependency-name: "transformers"
      - dependency-name: "peft"
      - dependency-name: "gradio"
